<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reserva de veículo efetuada com sucesso!</title>
</head>
<body>
<p>Olá <span th:text="${name}"></span>, seu veículo foi reservado com sucesso!</p>
<p>Efetue o pagamento no link a seguir, assim que confirmado o pagamento, entraremos em contato para agendar a retira do veículo.</p>
<p>Dados do veículo:</p>
<p><b><span th:text="${vehicle}"></span></b></p>
<p><a th:href="${link}">mercado pago</a></p>
<p>Em caso de dúvidas, nossa equipe ficará feliz em ajudá-lo no telefone (11) 99999-9999.</p>
</body>
</html>
